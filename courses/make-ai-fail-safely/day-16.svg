<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="d16title d16desc">
<title id="d16title">Covered is not caught: an invoice-matching prompt change from v6 to v7 adds "if the remittance has an open invoice number, match it". 240 golden cases written at launch, where invoice number, payer and amount all agree, score v7 240 of 240 and it ships; 37 payments are booked to the wrong customer in 9 days. 10 cases from the incident and the review queue, labelled by accounts receivable, fail on v7 10 of 10, and the fix v8 passes them all.</title>
<desc id="d16desc">Left: matching prompt v6 to v7, "If the remittance has an open invoice number, match it."; capsules: "PO 10452" is the payer's own PO, INV-10452 is another customer. Rose path, 240 written cases where all signals agree: v7 240/240, ships; teeth 0 of 240; WRONG, 37 payments on the wrong customer. Sea-glass path, 10 cases from real mistakes labelled by AR: v7 fails 10/10; v8 fix passes 10/10; SAFE, the set can tell broken from fixed. Footer: Prove a case can fail before you trust it to pass.</desc>
<defs><linearGradient id="g_teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fded6"/><stop offset="1" stop-color="#6fc3b8"/></linearGradient><linearGradient id="g_rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c0b8"/><stop offset="1" stop-color="#e3978d"/></linearGradient><linearGradient id="g_peri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b8f2"/><stop offset="1" stop-color="#7f93e0"/></linearGradient><linearGradient id="g_lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dccbec"/><stop offset="1" stop-color="#c3abdc"/></linearGradient><linearGradient id="g_butter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8dc8a"/><stop offset="1" stop-color="#ecc25a"/></linearGradient><linearGradient id="g_lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6ea8e"/><stop offset="1" stop-color="#bad466"/></linearGradient><linearGradient id="g_off" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f1ea"/><stop offset="1" stop-color="#dedbd1"/></linearGradient>
<radialGradient id="bg" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#ecebe7"/><stop offset="1" stop-color="#d9d7d1"/></radialGradient>
<linearGradient id="puff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".10"/></linearGradient>

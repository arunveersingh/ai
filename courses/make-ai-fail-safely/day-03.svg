<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-labelledby="d3title d3desc">
  <title id="d3title">Rule in message 1, many turns later, reply breaks the rule</title>
  <desc id="d3desc">A hard rule is stated in the first message. Many turns of other work follow and the rule fades. A new request pulls against the rule and the reply breaks it with no warning, while the rule is still visible on screen.</desc>
  <rect width="420" height="400" rx="14" fill="#161b22"/>
  <text x="210" y="32" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Still on your screen. Gone from the reply.</text>
  <rect x="24" y="50" width="372" height="86" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="40" y="74" fill="#58a6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">1. Rule in message 1</text>
  <text x="40" y="96" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">"Never log the full card number."</text>
  <text x="40" y="118" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">model agrees</text>
  <polygon points="202,144 218,144 210,158" fill="#8b949e"/>
  <rect x="24" y="164" width="372" height="86" rx="10" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="40" y="188" fill="#d29922" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">2. Twelve turns of other work</text>
  <text x="40" y="210" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">retries · error codes · refactor</text>
  <text x="40" y="232" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" opacity="0.55">"never log the full card number" (fading)</text>
  <polygon points="202,258 218,258 210,272" fill="#8b949e"/>
  <rect x="24" y="278" width="372" height="86" rx="10" fill="#21262d" stroke="#f85149" stroke-width="2"/>
  <text x="40" y="302" fill="#f85149" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">3. "Add debug logging"</text>
  <text x="40" y="324" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="13">log.debug("failed: %s", payload)</text>
  <text x="40" y="346" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">full card number logged, no warning</text>
</svg>

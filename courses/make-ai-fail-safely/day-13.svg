<text x="64" y="72" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7b7a75" text-anchor="start">MAKE AI FAIL SAFELY · DAY 13</text>
<text x="64" y="128" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#33363b" text-anchor="start">Approved is not reviewed</text>

  <text x="672" y="232" class="sans label" fill="#ff7b72">LISTED ONLY</text>
  <text x="800" y="232" class="sans ask">T2–T4 build on it</text>
  <text x="672" y="268" class="mono code">file is Amsterdam time <tspan fill="#8b949e">→</tspan> <tspan fill="#ff7b72">00:20 = 23:20 UTC</tspan></text>
  <text x="672" y="298" class="mono code"><tspan fill="#ff7b72">130.00 EUR</tspan> on the wrong day</text>
  <rect x="672" y="318" width="438" height="32" rx="16" fill="#2d1214"/>
  <path d="M689 327 l14 14 M703 327 l-14 14" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
  <text x="714" y="340" class="sans verdict" fill="#ff7b72">WRONG · false tickets, every night</text>

  <rect x="640" y="388" width="496" height="172" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="640" y="388" width="6" height="172" fill="#3fb950" clip-path="url(#cardB)"/>
  <text x="672" y="424" class="sans label" fill="#56d364">GATED</text>
  <text x="740" y="424" class="sans ask">KNOWN with a source, or wait</text>
  <text x="672" y="460" class="mono blk"><tspan fill="#56d364">BLOCKED:</tspan> T2–T4 · P1 UNKNOWN</text>
  <text x="672" y="490" class="mono blk" fill="#8b949e">acquirer spec: local time → P1 KNOWN</text>
  <rect x="672" y="510" width="438" height="32" rx="16" fill="#12261a"/>
  <path d="M688 526 l5 6 l10 -12" fill="none" stroke="#56d364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="714" y="532" class="sans verdict" fill="#56d364">SAFE · built on a fact, not a guess</text>

  <line x1="64" y1="600" x2="1136" y2="600" stroke="#21262d" stroke-width="1.5"/>
  <text x="64" y="640" class="sans foot">An unknown premise blocks the next step.</text>

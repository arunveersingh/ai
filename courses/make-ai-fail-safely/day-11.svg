<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="d11title d11desc">
  <title id="d11title">Listed is not resolved: a reconciliation plan lists the assumption that settlement file timestamps are UTC. Listed only, tasks 2 to 4 build on it, the file is Amsterdam time, and 130.00 EUR lands on the wrong day. Gated, the premise is UNKNOWN, tasks 2 to 4 wait, the acquirer spec is checked, and they run on a known premise.</title>
  <desc id="d11desc">Left card: the plan for RECON-212 with premise P1 "settlement timestamps are UTC" marked as an assumption with no source, and tasks T2 to T4 depending on it. Red path, listed only: T2 to T4 run; file is Amsterdam local time; two late-evening payments, 130.00 EUR, on the wrong day; false tickets; marked WRONG. Green path, gated: P1 UNKNOWN blocks T2 to T4; acquirer spec says local time; P1 KNOWN with source, then the tasks run; marked SAFE. Footer: An unknown premise blocks the next step.</desc>
  <defs>
    <clipPath id="cardA"><rect x="640" y="196" width="496" height="172" rx="18"/></clipPath>
    <clipPath id="cardB"><rect x="640" y="388" width="496" height="172" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 2px; fill: #8b949e; }
    .title { font-size: 48px; font-weight: 700; fill: #f0f6fc; }
    .sub { font-size: 21px; fill: #8b949e; }
    .spec { font-size: 24px; font-weight: 600; fill: #f0f6fc; }
    .rowlabel { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #6e7681; }
    .label { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
    .ask { font-size: 16px; fill: #8b949e; }
    .code { font-size: 16px; fill: #e6edf3; }
    .blk { font-size: 16px; fill: #e6edf3; }
    .verdict { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .note { font-size: 18px; fill: #8b949e; }
    .foot { font-size: 22px; font-weight: 600; fill: #c9d1d9; }
  </style>

    <rect width="1200" height="675" fill="#0d1117"/>
  <text x="64" y="74" class="sans eyebrow">MAKE AI FAIL SAFELY · DAY 11</text>
  <text x="64" y="130" class="sans title">Listed is not resolved</text>
  <text x="64" y="168" class="sans sub">An assumption that blocks nothing is decoration.</text>

  <rect x="64" y="210" width="472" height="330" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M64 246 v-18 a18 18 0 0 1 18 -18 h436 a18 18 0 0 1 18 18 v18 z" fill="#1c2128"/>
  <line x1="64" y1="246" x2="536" y2="246" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="92" cy="228" r="6" fill="#484f58"/><circle cx="114" cy="228" r="6" fill="#484f58"/><circle cx="136" cy="228" r="6" fill="#484f58"/>
  <text x="300" y="233" text-anchor="middle" class="mono" style="font-size:15px" fill="#6e7681">RECON-212 · the agent's plan</text>
  <text x="92" y="290" class="sans rowlabel">ASSUMPTION · NO SOURCE</text>
  <text x="92" y="330" class="sans spec">“Settlement file timestamps</text>
  <text x="92" y="362" class="sans spec">are <tspan fill="#d29922">UTC</tspan>.”</text>
  <rect x="92" y="388" width="416" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="108" y="411" class="mono" style="font-size:15px" fill="#e6edf3">T2 bucket · T3 match · T4 tickets <tspan fill="#d29922">← P1</tspan></text>
  <line x1="92" y1="448" x2="508" y2="448" stroke="#30363d" stroke-width="1"/>
  <text x="92" y="484" class="sans note">Written down on line one.</text>
  <text x="92" y="514" class="sans note">Does anything wait for it?</text>


<svg xmlns="http://www.w3.org/2000/svg" width="420" height="292" viewBox="0 0 420 292" role="img" aria-labelledby="d1title d1desc">
  <title id="d1title">Finished voice versus false fact</title>
  <desc id="d1desc">Two answers use the same calm, finished wording. One is a true fact a source can confirm. The other is a false fact the model invented. The tone does not show which is which.</desc>
  <rect width="420" height="292" rx="14" fill="#161b22"/>
  <text x="210" y="34" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Same finished voice</text>
  <text x="210" y="54" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">The wording does not say which is true</text>
  <rect x="18" y="74" width="184" height="168" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="110" y="104" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">the answer</text>
  <text x="110" y="128" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">"Shipped on</text>
  <text x="110" y="148" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">March 12."</text>
  <text x="110" y="172" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">calm, detailed, done</text>
  <text x="110" y="204" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">True fact</text>
  <text x="110" y="224" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">a source matches</text>
  <rect x="218" y="74" width="184" height="168" rx="10" fill="#21262d" stroke="#f85149" stroke-width="2"/>
  <text x="310" y="104" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">the answer</text>
  <text x="310" y="128" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">"Shipped on</text>
  <text x="310" y="148" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">March 12."</text>
  <text x="310" y="172" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">calm, detailed, done</text>
  <text x="310" y="204" text-anchor="middle" fill="#f85149" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">False fact</text>
  <text x="310" y="224" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">invented — nothing warns you</text>
</svg>

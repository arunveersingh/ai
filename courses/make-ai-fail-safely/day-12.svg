<radialGradient id="bg" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#ecebe7"/><stop offset="1" stop-color="#d9d7d1"/></radialGradient>
<linearGradient id="puff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".10"/></linearGradient>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="d12title d12desc">
<title id="d12title">Copied is not corroborated: premise P1 says payout amounts are in minor units, divide by 100. Three sources agree but all copy the payouts page, so when JPY is enabled every JPY payout is booked at 1/100 of its value. With two origins, one a real JPY payout from the sandbox, P1 is corrected and 5,000 yen is booked as 5,000 yen.</title>
<desc id="d12desc">Left: premise P1 "amount is in minor units, divide by 100", marked critical, with three source capsules: payouts page, SDK docstring, integration guide, all tied to one origin. Rose path, counted sources: 3 sources, 1 origin; JPY enabled later, amount 5000 booked as 50 yen; every JPY payout at 1/100; WRONG. Sea-glass path, counted origins: docs plus a sandbox JPY payout; 5000 means 5,000 yen; use the currency's decimals; SAFE. Footer: Same origin, one vote.</desc>

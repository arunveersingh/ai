<text x="64" y="72" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7b7a75" text-anchor="start">MAKE AI FAIL SAFELY · DAY 15</text>
<text x="64" y="128" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#33363b" text-anchor="start">Passing is not measuring</text>
<text x="64" y="166" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6c6b66" text-anchor="start">An eval answers the question you coded into it, not the harm you fear.</text>

<text x="890" y="236" font-family="Inter, 'Google Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6b4440" text-anchor="start">accuracy vs 92% bar</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="d20title d20desc">
<title id="d20title">Patched is not fixed. A parcel company's app: customers message it, and an AI changes their delivery to a new day, a neighbour or a pickup point. A customer with two parcels on the way asks for "my parcel" to go to the neighbour at number 12, and the AI moves the wrong one. Each complaint gets its own fix, nine in six weeks, and mistakes stay at about 40 a week. Sorted by why the AI went wrong, the biggest kind, changing the wrong parcel, has 41 mistakes and no fixes; one fix for that kind cuts it from 41 to 3.</title>
<desc id="d20desc">Top row, red: a customer with two parcels writes "Leave my parcel with number 12" and the AI moves the wrong one; each complaint gets one fix, a new line in the AI's instructions, nine fixes in six weeks; mistakes are still about 40 a week, 42 in week 1 and 40 in week 6. Note: each fix matched one complaint's words; the next mistake used different words. Bottom row, green: someone sorts 120 mistakes by why the AI went wrong, not what the customer saw; biggest kind, the wrong parcel changed: 41 mistakes, 0 fixes; loudest kind, ignored a "don't": 7 mistakes, 4 fixes. One fix for the whole kind: the AI names the parcel and asks when two could fit; wrong-parcel mistakes fall from 41 to 3 in three weeks. Strip: the loudest kind got the most fixes, the biggest kind got none. Footer: fix the kind, not the case.</desc>
